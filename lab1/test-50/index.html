<body>
<title>Test de Laboratorio U1</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: una columna estrecha tipo "ficha de prácticas": cabecera con marcador, tarjeta de pregunta, navegación por puntos */
:root{
  --bg:#eef3f3; --surface:#ffffff; --ink:#14232a; --muted:#5b6d73; --line:#d3dfe0;
  --accent:#0d6e6e; --accent-soft:#d6ecea; --ok:#15803d; --ok-soft:#dcf3e3; --bad:#c2410c; --bad-soft:#fde4d6;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#172327; --ink:#e4eeef; --muted:#93a7ac; --line:#2a3a3f;
  --accent:#4fc4bd; --accent-soft:#163a3a; --ok:#4ade80; --ok-soft:#173826; --bad:#fb923c; --bad-soft:#3d2414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#172327; --ink:#e4eeef; --muted:#93a7ac; --line:#2a3a3f;
  --accent:#4fc4bd; --accent-soft:#163a3a; --ok:#4ade80; --ok-soft:#173826; --bad:#fb923c; --bad-soft:#3d2414; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.score{display:flex;gap:12px}
.score span b{font-weight:500}
.s-ok{color:var(--ok)} .s-bad{color:var(--bad)} .s-left{color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(18px,4.4vw,22px);line-height:1.3;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:11px 12px;display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt .l{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .l{color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .l{color:var(--bad)}
.fb{border-left:4px solid var(--ok);background:var(--ok-soft);padding:10px 12px;border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:2px}
.fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb strong{font-family:var(--f-display)}
.fb small{font-family:var(--f-mono);color:var(--muted)}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border-radius:8px;padding:10px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--surface);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.dot{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.section-title{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.result{display:flex;flex-direction:column;gap:12px}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:1;font-variant-numeric:tabular-nums}
.verdict{font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500}
.tip{font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Técnicas Generales de Laboratorio · Unidad 1</span>
    <h1>Test de 50 preguntas</h1>
    <p class="sub">Elige una opción y verás al momento si es correcta, por qué y de qué diapositiva sale. Tu progreso se guarda en este navegador.</p>
  </header>

  <div class="bar" aria-live="polite">
    <div class="score">
      <span class="s-ok">✔ <b id="nOk">0</b></span>
      <span class="s-bad">✘ <b id="nBad">0</b></span>
      <span class="s-left">Sin responder: <b id="nLeft">50</b></span>
    </div>
    <span id="pos">Pregunta 1 de 50</span>
  </div>
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>

  <div class="filters" id="filters" role="group" aria-label="Filtrar por bloque"></div>

  <section class="card" id="card" aria-live="polite"></section>

  <div class="nav">
    <button class="btn" id="prev" type="button">← Anterior</button>
    <button class="btn primary" id="next" type="button">Siguiente →</button>
  </div>

  <p class="section-title">Ir a una pregunta</p>
  <div class="dots" id="dots"></div>

  <div class="nav">
    <button class="btn" id="retry" type="button">Repetir solo las falladas</button>
    <button class="btn" id="results" type="button">Ver resultado</button>
    <button class="btn" id="reset" type="button">Empezar de cero</button>
  </div>
  <p class="tip" id="confirmMsg" hidden></p>
</div>

<script>

tar, mezclar sin mucha exactitud, retener…", "d": 20}, {"n": 15, "s": "Materiales", "b": "Bloque 1", "q": "Los tubos de ensayo:", "o": ["Se usan para medir volúmenes exactos", "Son siempre de porcelana", "Siempre están graduados", "Normalmente no están graduados"], "a": 3, "e": "Existen graduados, pero lo normal es que no lo estén.", "d": 21}, {"n": 16, "s": "Materiales", "b": "Bloque 1", "q": "¿Qué material transforma a fase líquida los gases generados en la destilación?", "o": ["Desecador", "Tubo refrigerante", "Vidrio de reloj", "Kitasato"], "a": 1, "e": "Tubo refrigerante.", "d": 23}, {"n": 17, "s": "Materiales", "b": "Bloque 1", "q": "¿Para qué sirve el termómetro en el laboratorio?", "o": ["Para medir la concentración", "Para conocer la temperatura de la sustancia de estudio", "Para medir el pH", "Para medir la densidad"], "a": 1, "e": "Termómetro.", "d": 24}, {"n": 18, "s": "Materiales", "b": "Bloque 1", "q": "¿Para qué sirve la placa Petri?", "o": ["Para el cultivo de colonias de microorganismos", "Para filtrar", "Para observar muestras al microscopio", "Para pesar sólidos"], "a": 0, "e": "Placa Petri: redonda con tapa, cultivo de colonias.", "d": 26}, {"n": 19, "s": "Materiales", "b": "Bloque 1", "q": "El embudo Büchner sirve para:", "o": ["Condensar gases", "Calcinar sustancias", "Filtrar sustancias con vacío", "Trasvasar líquidos sin filtrar"], "a": 2, "e": "Büchner: filtra con vacío (porcelana).", "d": 29}, {"n": 20, "s": "Materiales", "b": "Bloque 1", "q": "¿Cuál de estos NO es material de metal de soporte según la profe?", "o": ["Nuez", "Trípode", "Gradilla", "Vidrio de reloj"], "a": 3, "e": "Metal: aros, trípodes, nuez, pinzas, soportes, espátulas, gradillas, escobillas.", "d": 30}, {"n": 21, "s": "Limpieza, desinfección y esterilización", "b": "Bloque 2", "q": "La precisión de una medida es:", "o": ["La marca de un volumen concreto", "El error del instrumento", "El valor verdadero o real de la medida", "Su reproducibilidad, aunque no implique que sea const KEY = "lab-u1-test50";
let state = { ans: {}, cur: 0, filter: "Todos", only: null };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.ans) state = Object.assign(state, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const blocks = ["Todos", ...new Set(Q.map(q => q.s))];
const $ = id => document.getElementById(id);
let showResults = false, resetArmed = false;

function list() {
  let l = Q.map((q, i) => i);
  if (state.filter !== "Todos") l = l.filter(i => Q[i].s === state.filter);
  if (state.only) l = l.filter(i => state.only.includes(i));
  return l;
}
function renderFilters() {
  $("filters").innerHTML = "";
  blocks.forEach(b => {
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.textContent = b;
    c.setAttribute("aria-pressed", String(state.filter === b && !state.only));
    c.onclick = () => { state.filter = b; state.only = null; showResults = false; const l = list(); state.cur = l[0]; save(); render(); };
    $("filters").appendChild(c);
  });
  if (state.only) {
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button"; c.textContent = "Repasando falladas (" + state.only.length + ")"; c.setAttribute("aria-pressed", "true");
    $("filters").appendChild(c);
  }
}
function renderScore() {
  const v = Object.entries(state.ans);
  const ok = v.filter(([i, a]) => Q[i].a === a).length;
  $("nOk").textContent = ok; $("nBad").textContent = v.length - ok; $("nLeft").textContent = Q.length - v.length;
  $("prog").style.width = (v.length / Q.length * 100) + "%";
}
function renderCard() {
  const l = list(); if (!l.includes(state.cur)) state.cur = l[0];
  const i = state.cur, q = Q[i], picked = state.ans[i];
  const k = l.indexOf(i);
  $("pos").textContent = "Pregunta " + (k + 1) + " de " + l.length;
  const card = $("card"); card.innerHTML = "";
  const meta = document.createElement("div"); meta.className = "meta";
  meta.innerHTML = "<span>" + q.b + " · " + q.s + "</span><span>Nº " + q.n + " · diap. " + q.d + "</span>";
  const h = document.createElement("h2"); h.className = "q"; h.textContent = q.q;
  const ul = document.createElement("ul"); ul.className = "opts";
  q.o.forEach((o, j) => {
    const li = document.createElement("li");
    const b = document.createElement("button"); b.type = "button"; b.className = "opt";
    b.innerHTML = '<span class="l">' + "abcd"[j] + ')</span><span></span>';
    b.lastChild.textContent = o;
    if (picked !== undefined) {
      b.disabled = true;
      if (j === q.a) b.classList.add("right");
      else if (j === picked) b.classList.add("wrong");
    }
    b.onclick = () => { state.ans[i] = j; save(); render(); };
    li.appendChild(b); ul.appendChild(li);
  });
  card.append(meta, h, ul);
  if (picked !== undefined) {
    const good = picked === q.a;
    const fb = document.createElement("div"); fb.className = "fb" + (good ? "" : " no");
    const s = document.createElement("strong"); s.textContent = good ? "¡Correcto!" : "No es esa. La correcta es la " + "abcd"[q.a] + ")";
    const p = document.createElement("span"); p.textContent = q.e;
    const sm = document.createElement("small"); sm.textContent = "📍 Diapositiva " + q.d + " del PDF de la profe";
    fb.append(s, p, sm); card.appendChild(fb);
  }
  $("prev").disabled = k <= 0;
  $("next").textContent = k >= l.length - 1 ? "Ver resultado" : "Siguiente →";
}
function renderDots() {
  const l = list(); $("dots").innerHTML = "";
  l.forEach(i => {
    const d = document.createElement("button"); d.type = "button"; d.className = "dot"; d.textContent = Q[i].n;
    d.setAttribute("aria-label", "Pregunta " + Q[i].n);
    if (state.ans[i] !== undefined) d.classList.add(state.ans[i] === Q[i].a ? "ok" : "no");
    if (i === state.cur && !showResults) d.classList.add("cur");
    d.onclick = () => { state.cur = i; showResults = false; save(); render(); };
    $("dots").appendChild(d);
  });
}
function renderResults() {
  const card = $("card"); card.innerHTML = "";
  const v = Object.entries(state.ans); const ok = v.filter(([i, a]) => Q[i].a === a).length;
  const box = document.createElement("div"); box.className = "result";
  const big = document.createElement("div"); big.className = "big"; big.textContent = ok + " / 50";
  const ver = document.createElement("p"); ver.className = "verdict";
  ver.textContent = ok >= 40 ? "Vas muy bien. Repasa solo las que fallaste." : ok >= 35 ? "Bien encaminado. Repasa los bloques con más fallos." : ok >= 25 ? "Aprobado justo. Vuelve al Repaso en los bloques flojos." : "Toca repasar. Empieza por Lo imprescindible y repite el test.";
  const t = document.createElement("table");
  t.innerHTML = "<thead><tr><th>Bloque</th><th>Aciertos</th><th>Fallos</th><th>Sin responder</th></tr></thead>";
  const tb = document.createElement("tbody");
  blocks.slice(1).forEach(b => {
    const ids = Q.map((q, i) => i).filter(i => Q[i].s === b);
    const a = ids.filter(i => state.ans[i] === Q[i].a).length, f = ids.filter(i => state.ans[i] !== undefined && state.ans[i] !== Q[i].a).length;
    const tr = document.createElement("tr"); tr.innerHTML = "<td></td><td>" + a + "</td><td>" + f + "</td><td>" + (ids.length - a - f) + "</td>";
    tr.firstChild.textContent = b; tb.appendChild(tr);
  });
  t.appendChild(tb);
  const wrap = document.createElement("div"); wrap.style.overflowX = "auto"; wrap.appendChild(t);
  box.append(big, ver, wrap); card.appendChild(box);
  $("pos").textContent = "Resultado";
  $("prev").disabled = false; $("next").textContent = "Volver al test";
}
function render() { renderFilters(); renderScore(); renderDots(); showResults ? renderResults() : renderCard(); }

$("prev").onclick = () => { if (showResults) { showResults = false; return render(); } const l = list(), k = l.indexOf(state.cur); if (k > 0) { state.cur = l[k - 1]; save(); render(); } };
$("next").onclick = () => { if (showResults) { showResults = false; return render(); } const l = list(), k = l.indexOf(state.cur); if (k < l.length - 1) { state.cur = l[k + 1]; save(); render(); } else { showResults = true; render(); } window.scrollTo({ top: 0 }); };
$("results").onclick = () => { showResults = true; render(); };
$("retry").onclick = () => {
  const f = Q.map((q, i) => i).filter(i => state.ans[i] !== undefined && state.ans[i] !== Q[i].a);
  const msg = $("confirmMsg");
  if (!f.length) { msg.hidden = false; msg.textContent = "No tienes preguntas falladas."; return; }
  f.forEach(i => delete state.ans[i]); state.only = f; state.filter = "Todos"; state.cur = f[0]; showResults = false; msg.hidden = true; save(); render();
};
$("reset").onclick = () => {
  const msg = $("confirmMsg");
  if (!resetArmed) { resetArmed = true; msg.hidden = false; msg.textContent = "Pulsa otra vez «Empezar de cero» para borrar todas tus respuestas."; $("reset").textContent = "Sí, borrar todo"; return; }
  state = { ans: {}, cur: 0, filter: "Todos", only: null }; resetArmed = false; showResults = false; msg.hidden = true; $("reset").textContent = "Empezar de cero"; save(); render();
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  const n = "1234abcd".indexOf(e.key.toLowerCase());
  if (n >= 0 && !showResults && state.ans[state.cur] === undefined) { state.ans[state.cur] = n % 4; save(); render(); }
  if (e.key === "ArrowRight") $("next").click();
  if (e.key === "ArrowLeft") $("prev").click();
});
render();
</script>
