<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi carrera TSAPC</title>
<meta name="description" content="Repasos, simulacros y material de estudio de 1.º de TSAPC, Anatomía Patológica y Citodiagnóstico.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14121b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Paleta de la tinción hematoxilina-eosina: papel, índigo para la acción y rosa para el detalle */
:root{
  --paper:#f7f4ee; --ink:#1d1a26; --muted:#655f6e; --line:#e2dcd1; --edge:#938c80; --hema:#3a2f7d; --hema-ink:#ffffff; --hema-soft:#ebe8f4;
  --eosin:#b23a63; --cyto:#e9a9bd; --nuc:#4a3b92; --field:#fbeef0;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#14121b; --ink:#efebf4; --muted:#a79fb2; --line:#2e2a39; --edge:#6f687b; --hema:#b9b0f2; --hema-ink:#17142a; --hema-soft:#26223a;
  --eosin:#f08bab; --cyto:#7c3a56; --nuc:#b3a7f2; --field:#1f1824; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#14121b; --ink:#efebf4; --muted:#a79fb2; --line:#2e2a39; --edge:#6f687b; --hema:#b9b0f2; --hema-ink:#17142a; --hema-soft:#26223a;
  --eosin:#f08bab; --cyto:#7c3a56; --nuc:#b3a7f2; --field:#1f1824; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-block:clamp(28px,6vw,72px) 72px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3,p{margin:0}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--eosin);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.hero{display:grid;grid-template-columns:minmax(0,1fr) clamp(120px,32vw,340px);gap:clamp(16px,5vw,64px);align-items:center;margin-bottom:clamp(36px,6vw,72px)}
.place{color:var(--muted);font-size:.92em;max-width:34ch}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(3.1rem,9.5vw,6.6rem);line-height:.98;letter-spacing:-.025em;margin:.16em 0 .22em}
.summary{font-size:1.08em;max-width:38ch}
.summary b{font-weight:700}
.field{aspect-ratio:1;border-radius:50%;background:var(--field);overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 0 7px var(--paper),0 0 0 8px var(--line)}
.field svg{display:block;width:100%;height:100%}
.field .c{fill:var(--cyto)}
.field .n{fill:var(--nuc)}

.filter{display:flex;gap:4px 8px;flex-wrap:wrap;margin-inline:-6px;padding-inline:6px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.filter button{appearance:none;background:none;border:0;font:inherit;font-size:.95em;color:var(--muted);min-height:44px;min-width:44px;padding:0 6px;cursor:pointer;text-underline-offset:6px;text-decoration-thickness:2px}
.filter button:hover{color:var(--ink)}
.filter button[aria-pressed="true"]{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--eosin)}

.group{margin-top:clamp(36px,5vw,56px)}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(1.65rem,3.4vw,2.15rem);letter-spacing:-.012em}
.count{color:var(--muted);font-size:.92em}

.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 32px;align-items:center;padding-block:20px;border-bottom:1px solid var(--line);scroll-margin-top:16px}
.ex:target h3{color:var(--eosin)}
.meta{color:var(--muted);font-size:.88em}
.when{white-space:nowrap}
.when.soon{color:var(--eosin);font-weight:700}
h3{font-family:var(--f-display);font-weight:500;font-size:1.32em;line-height:1.22;margin-top:2px;text-wrap:pretty}
.actions{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:104px;padding:0 16px;border-radius:999px;font-size:.94em;font-weight:700;text-decoration:none;transition:background-color .18s ease,color .18s ease}
.btn.main{background:var(--hema);color:var(--hema-ink)}
.btn.main:hover{background:var(--eosin);color:var(--hema-ink)}
.btn:active{transform:translateY(1px)}
.btn.alt{box-shadow:inset 0 0 0 1px var(--edge)}
.btn.alt:hover{background:var(--hema-soft)}
.btn.off{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:400}
.btn .tag{font-weight:400;font-size:.82em;margin-left:6px;opacity:.75}

details{grid-column:1/-1}
summary{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-block:-8px;color:var(--muted);font-size:.9em;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.25em;line-height:1;color:var(--eosin)}
details[open] summary::after{content:"−"}
summary:hover{color:var(--ink)}
.more{list-style:none;margin:10px 0 2px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:0 28px}
.more a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;font-size:.93em;text-decoration:none;border-top:1px solid var(--line)}
.more a:hover{color:var(--eosin)}
.more .kind{color:var(--muted);font-size:.82em}
.past h3{font-size:1.14em}

.foot{color:var(--muted);font-size:.88em;margin-top:40px;max-width:60ch;text-wrap:pretty}
.sep{white-space:pre}

@media (max-width:680px){
  body{font-size:16px}
  .ex{grid-template-columns:minmax(0,1fr)}
  .actions .btn{flex:1 1 0}
  .hero{grid-template-columns:minmax(0,1fr) 72px;gap:0 16px;align-items:center;margin-bottom:22px}
  .hero-text{display:contents}
  h1{grid-column:1;grid-row:1;font-size:2.7rem;margin:0}
  .place{grid-column:1/-1;grid-row:2;font-size:.82em;max-width:none;margin-top:8px}
  .field{grid-column:2;grid-row:1;box-shadow:0 0 0 1px var(--line)}
  .summary{grid-column:1/-1;grid-row:3;margin-top:8px;max-width:none;font-size:1em}
  .when{display:block}
  .filter{gap:0 4px;font-size:.94em;padding-bottom:8px}
  .group{margin-top:22px}
  .ex{padding-block:16px}
  .sep.last{display:none}
  .more{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<main class="wrap">
<header class="hero">
  <div class="hero-text">
    <p class="place">Anatomía Patológica y Citodiagnóstico · 1.º TSAPC · Impulsa Pamplona</p>
    <h1>Mi carrera</h1>
    <p class="summary" id="summary"></p>
  </div>
  <div class="field" id="field" aria-hidden="true"></div>
</header>
<div class="filter" id="filter" role="group" aria-label="Filtrar por asignatura"></div>
<p class="sr-only" id="status" role="status"></p>
<noscript><p>Esta página necesita JavaScript para mostrar los exámenes.</p></noscript>
<div id="list"></div>
<p class="foot">En cada página tienes arriba el botón «← Menú» para volver aquí. Los PDF se pueden descargar.</p>
</main>
<script>
const EX=[{"id": "fisio3", "asig": "Fisiopatología", "em": "🫀", "col": "fisio", "ex": "3er examen", "tema": "Unidad 3 · La patología: estudio de la enfermedad", "fecha": null, "rep": {"web": "fisio3/repaso/", "pdf": "files/FISIO3_1-Repaso_Patologia.pdf"}, "sim": {"web": "fisio3/simulacro/", "pdf": "files/FISIO3_2-Simulacro_Patologia.pdf"}, "extra": [["⚡ Lo imprescindible", "files/FISIO3_3-Imprescindible_Patologia.pdf"], ["✅ Verificación", "files/FISIO3_5-Verificacion_Patologia.pdf"]]}, {"id": "fisio2", "asig": "Fisiopatología", "em": "🫀", "col": "fisio", "ex": "2º examen", "tema": "Unidad 2 · Tejidos y anatomía", "fecha": "2026-10-28", "rep": {"web": "fisio2/repaso/", "pdf": "files/FISIO2_1-Repaso_Tejidos_28.oct.pdf"}, "sim": {"web": "fisio2/simulacro/", "pdf": "files/FISIO2_2-Simulacro_Tejidos_28.oct.pdf"}, "extra": [["⚡ Lo imprescindible", "files/FISIO2_3-Imprescindible_Tejidos_28.oct.pdf"], ["✏️ Esquemas para rellenar", "files/FISIO2_4-Esquemas-Rellenar_Tejidos_28.oct.pdf"], ["✅ Verificación", "files/FISIO2_5-Verificacion_Tejidos_28.oct.pdf"]]}, {"id": "ipe3", "asig": "IPE 1", "em": "🦺", "col": "ipe", "ex": "Tema 5", "tema": "Los primeros auxilios en la empresa", "fecha": null, "rep": {"web": "ipe-tema5/repaso/", "pdf": "files/IPE3_1-Repaso_Primeros-Auxilios.pdf"}, "sim": {"web": "ipe-tema5/simulacro/"}, "extra": [["⚡ Lo imprescindible", "files/IPE3_3-Imprescindible_Primeros-Auxilios.pdf"], ["✅ Verificación", "files/IPE3_5-Verificacion_Primeros-Auxilios.pdf"]]}, {"id": "bio2", "asig": "Biología Molecular", "em": "🧬", "col": "bio", "ex": "2º examen", "tema": "Tema 3 · Citogenética y análisis cromosómico", "fecha": null, "rep": {"web": "bio2/repaso/", "pdf": "files/BIO2_1-Repaso_Citogenetica.pdf"}, "sim": {"web": "bio2/simulacro/", "pdf": "files/BIO2_2-Simulacro_Citogenetica.pdf"}, "extra": [["⚡ Lo imprescindible", "files/BIO2_3-Imprescindible_Citogenetica.pdf"], ["✅ Verificación", "files/BIO2_5-Verificacion_Citogenetica.pdf"]]}, {"id": "gest2", "asig": "Gestión de Muestras", "em": "🧫", "col": "gest", "ex": "2º examen", "tema": "Tema 2 · Funciones, áreas y organización del laboratorio", "fecha": null, "rep": {"web": "gest2/repaso/", "pdf": "files/GESTION2_1-Repaso_Laboratorio.pdf"}, "sim": {"web": "gest2/simulacro/", "pdf": "files/GESTION2_2-Simulacro-Test_Laboratorio.pdf"}, "extra": [["⚡ Lo imprescindible", "files/GESTION2_3-Imprescindible_Laboratorio.pdf"], ["✅ Verificación", "files/GESTION2_5-Verificacion_Laboratorio.pdf"]]}, {"id": "ing1", "asig": "Inglés", "em": "🇬🇧", "col": "ing", "ex": "1er examen", "tema": "Unit 1 verbos · Unit 2 presentes · vocabulario de laboratorio", "fecha": "2026-10-23", "rep": {"web": "ingles1/repaso/", "pdf": "files/INGLES1_1-Repaso_Tiempos.pdf"}, "sim": {"web": "ingles1/simulacro/", "pdf": "files/INGLES1_2-Simulacro_Tiempos.pdf"}, "extra": [["🌐 Aprende las 50 palabras", "ingles1/vocabulario/"], ["🌐 Examen Units 1–2", "ingles1/examen/"], ["🌐 Examen de vocabulario", "ingles1/examen-vocabulario/"], ["🌐 Simulacro de vocabulario", "ingles1/simulacro-vocabulario/"], ["📄 Repaso breve + 50 palabras", "files/INGLES1_1-Repaso-Breve_Vocabulario.pdf"], ["⚡ Lo imprescindible", "files/INGLES1_3-Imprescindible_Tiempos.pdf"]]}, {"id": "ipe2", "asig": "IPE 1", "em": "🦺", "col": "ipe", "ex": "2º examen", "tema": "Tema 3 · Riesgos ambientales en el trabajo", "fecha": "2026-10-13", "rep": {"web": "ipe2/repaso/", "pdf": "files/IPE2_1-Repaso_Riesgos-Ambientales.pdf"}, "sim": {"web": "ipe2/simulacro/", "pdf": "files/IPE2_2-Simulacro-Tipo-Examen_Riesgos-Ambientales.pdf"}, "extra": [["📄 Simulacro test", "files/IPE2_2-Simulacro-Test_Riesgos-Ambientales.pdf"], ["📄 Simulacro rápido", "files/IPE2_2-Simulacro-Rapido_Riesgos-Ambientales.pdf"], ["⚡ Lo imprescindible", "files/IPE2_3-Imprescindible_Riesgos-Ambientales.pdf"]]}, {"id": "lab1", "asig": "Técnicas Generales de Laboratorio", "em": "🧪", "col": "lab", "ex": "1er examen", "tema": "Unidad 1", "fecha": "2026-10-22", "rep": {"web": "lab1/repaso/", "pdf": "files/LAB1_1-Repaso_Unidad1_22.oct.pdf"}, "sim": {"web": "lab1/banco/", "webt": "Banco completo (153 preguntas)", "pdf": "files/LAB1_2-Simulacro-Test_Unidad1_22.oct.pdf"}, "extra": [["🌐 Test de 50", "lab1/test-50/"], ["🌐 Segundo test de 50", "lab1/test-50-b/"], ["📄 50 con respuestas", "files/LAB1_2-Simulacro-50-con-Respuestas_Unidad1_22.oct.pdf"], ["⚡ Lo imprescindible", "files/LAB1_3-Imprescindible_Unidad1_22.oct.pdf"]]}, {"id": "bio1", "asig": "Biología Molecular", "em": "🧬", "col": "bio", "ex": "1er examen", "tema": "Tema 2 · Cultivos celulares", "fecha": "2026-10-19", "rep": {"web": "bio1/repaso/", "pdf": "files/BIO1_1-Repaso_Cultivos_19.oct.pdf"}, "sim": {"web": "bio1/simulacro/", "pdf": "files/BIO1_2-Simulacro_Cultivos_19.oct.pdf"}, "extra": [["🔬 Neubauer y microscopio", "files/BIO1_4-Neubauer-Microscopio_Cultivos_19.oct.pdf"], ["⚡ Lo imprescindible", "files/BIO1_3-Imprescindible_Cultivos_19.oct.pdf"]]}, {"id": "gest1", "asig": "Gestión de Muestras", "em": "🧫", "col": "gest", "ex": "1er examen", "tema": "Tema 1 · Estructura organizativa del sector sanitario", "fecha": "2026-10-15", "rep": {"web": "gest1/repaso/", "pdf": "files/GESTION1_1-Repaso_Sector-Sanitario_15.oct.pdf"}, "sim": {"web": "gest1/simulacro/", "pdf": "files/GESTION1_2-Simulacro-Test_Sector-Sanitario_15.oct.pdf"}, "extra": [["⚡ Lo imprescindible", "files/GESTION1_3-Imprescindible_Sector-Sanitario_15.oct.pdf"]]}, {"id": "fisio1", "asig": "Fisiopatología", "em": "🫀", "col": "fisio", "ex": "1er examen", "tema": "Unidad 1 · La organización del cuerpo humano", "fecha": "2026-10-13", "rep": {"web": "fisio1/repaso/", "pdf": "files/FISIO1_1-Repaso_Organizacion_13.oct.pdf"}, "sim": {"web": "fisio1/simulacro/"}, "extra": [["⚡ Lo imprescindible", "files/FISIO1_3-Imprescindible_Organizacion_13.oct.pdf"], ["🧭 Cómo estudiar", "files/FISIO1_4-Como-Estudiar_Organizacion_13.oct.pdf"]]}];
const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"],DIAS=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
const today=new Date();today.setHours(0,0,0,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
EX.forEach(e=>{if(e.fecha){const d=new Date(e.fecha+"T00:00:00");e.days=Math.round((d-today)/864e5);e.fd=DIAS[d.getDay()]+" "+d.getDate()+" "+MES[d.getMonth()];e.state=e.days<0?"done":"up"}else e.state="tbd"});
const asigs=[...new Set(EX.map(e=>e.asig))];
const upcoming=EX.filter(e=>e.state==="up").sort((a,b)=>a.days-b.days);
const toStudy=[...upcoming,...EX.filter(e=>e.state==="tbd")];
const past=EX.filter(e=>e.state==="done").sort((a,b)=>a.days===b.days?0:b.days-a.days);
const nx=upcoming[0];
const countAsig=l=>new Set(l.map(e=>e.asig)).size;
const SHORT={"Técnicas Generales de Laboratorio":"Laboratorio","Gestión de Muestras":"Gestión","Biología Molecular":"Biología"};

document.getElementById("summary").innerHTML=nx
  ?`<b>${nx.days===0?"Hoy":nx.days===1?"Mañana":"En "+nx.days+" días"}</b>: ${esc(nx.asig)}, ${esc(nx.ex)}. ${toStudy.length} por preparar en ${countAsig(toStudy)} ${countAsig(toStudy)===1?"asignatura":"asignaturas"}.`
  :`<b>${toStudy.length} exámenes por preparar</b>, todavía sin fecha. ${past.length} ya pasados.`;

const when=e=>e.state==="up"?`<span class="when${e.days<=7?" soon":""}">${e.days===0?"Hoy":e.days===1?"Mañana":"Faltan "+e.days+" días"} · ${e.fd}</span>`:e.state==="done"?`<span class="when">Pasado · ${e.fd}</span>`:`<span class="when">Fecha por confirmar</span>`;
function btn(kind,o,cls,e){const T=kind==="rep"?"Repaso":"Simulacro",L=`aria-label="${T}: ${esc(e.asig)}, ${esc(e.ex)}"`;
  if(o.web)return `<a class="btn ${cls}" href="${o.web}" ${L}>${T}</a>`;
  if(o.pdf)return `<a class="btn ${cls}" href="${o.pdf}" ${L}>${T}<span class="tag">PDF</span></a>`;
  return `<span class="btn off">${T}: pendiente</span>`}
const clean=t=>t.replace(/^[^\p{L}\p{N}]+/u,"");
function materials(e){const m=[];
  if(e.rep.web&&e.rep.pdf)m.push(["Repaso",e.rep.pdf]);
  if(e.sim.web&&e.sim.pdf)m.push(["Simulacro",e.sim.pdf]);
  (e.extra||[]).forEach(([t,u])=>m.push([clean(t),u]));
  return m}
function row(e){const m=materials(e);
  return `<article class="ex${e.state==="done"?" past":""}" id="${e.id}">
   <div><p class="meta">${esc(e.asig)} · ${esc(e.ex)}<span class="sep last"> · </span>${when(e)}</p><h3>${esc(e.tema)}</h3>${e.sim.webt?`<p class="meta">Simulacro: ${esc(e.sim.webt)}</p>`:""}</div>
   <div class="actions">${btn("rep",e.rep,"main",e)}${btn("sim",e.sim,"alt",e)}</div>
   ${m.length?`<details><summary aria-label="Más material de ${esc(e.asig)}, ${esc(e.ex)}: ${m.length}">Más material (${m.length})</summary><ul class="more">${m.map(([t,u])=>`<li><a href="${u}"><span>${esc(t)}</span><span class="kind">${/\.pdf$/i.test(u)?"PDF":"Web"}</span></a></li>`).join("")}</ul></details>`:""}
  </article>`}
function group(title,list){return list.length?`<section class="group"><div class="group-h"><h2>${title}</h2><span class="count"><span aria-hidden="true">${list.length}</span><span class="sr-only">${list.length} ${list.length===1?"examen":"exámenes"}</span></span></div>${list.map(row).join("")}</section>`:""}

let current=null;try{const c=sessionStorage.getItem("asig");if(asigs.includes(c))current=c}catch(_){}
const list=document.getElementById("list"),filter=document.getElementById("filter");
function render(){const f=a=>!current||a.asig===current;
  list.innerHTML=group("Por preparar",toStudy.filter(f))+group("Ya pasados",past.filter(f));
  filter.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.a||null)===current)));
  const n=list.querySelectorAll(".ex").length;document.getElementById("status").textContent=n+(n===1?" examen":" exámenes")+(current?" de "+current:"");
  try{current?sessionStorage.setItem("asig",current):sessionStorage.removeItem("asig")}catch(_){}}
filter.innerHTML=`<button type="button" data-a="">Todas</button>`+asigs.map(a=>`<button type="button" data-a="${esc(a)}">${esc(SHORT[a]||a)}</button>`).join("");
filter.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;current=b.dataset.a||null;render()});
render();
// Un enlace directo a un examen quita el filtro si lo estaba ocultando
addEventListener("hashchange",()=>{const id=location.hash.slice(1);if(id&&current&&!document.getElementById(id)){current=null;render();document.getElementById(id)?.scrollIntoView()}});
if(location.hash&&!document.getElementById(location.hash.slice(1))){current=null;render();document.getElementById(location.hash.slice(1))?.scrollIntoView()}

// Campo de microscopio: células generadas con una semilla fija, igual en cada visita
(function(){let s=20261030;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
  let out="";const step=9.4;let row=0;
  for(let y=-4;y<=104;y+=step*.86,row++)for(let x=-4+(row%2?step/2:0);x<=104;x+=step){
    const cx=x+(r()-.5)*4.6,cy=y+(r()-.5)*4.6,a=(r()*180).toFixed(0),rx=(3.5+r()*1.7).toFixed(2),ry=(2.8+r()*1.3).toFixed(2),nr=(1.25+r()*.75).toFixed(2),dx=((r()-.5)*1.5).toFixed(2),dy=((r()-.5)*1.5).toFixed(2);
    out+=`<g transform="translate(${cx.toFixed(2)} ${cy.toFixed(2)}) rotate(${a})"><ellipse class="c" rx="${rx}" ry="${ry}" opacity="${(.5+r()*.5).toFixed(2)}"/><circle class="n" cx="${dx}" cy="${dy}" r="${nr}" opacity="${(.72+r()*.28).toFixed(2)}"/></g>`}
  document.getElementById("field").innerHTML=`<svg viewBox="0 0 100 100" focusable="false">${out}</svg>`})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// El contenido ya es visible sin GSAP; la animación solo se añade si la librería carga pronto y el movimiento está permitido
if(window.gsap&&performance.now()<800&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
  gsap.from("#field svg",{filter:"blur(9px)",scale:1.16,duration:1.7,ease:"power2.out",clearProps:"filter,transform"});
  gsap.from(".hero h1, .place, .summary",{y:10,opacity:0,duration:.7,ease:"power2.out",stagger:.07,clearProps:"all"});
}
</script>
