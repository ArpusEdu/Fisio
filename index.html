<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mi carrera TSAPC</title>
<meta name="description" content="Repasos, simulacros y material de estudio de 1.º de TSAPC, Anatomía Patológica y Citodiagnóstico.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#21124f">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:wght@400;700&family=Caveat:wght@700&display=swap">
<style>
/* Capítulos de color de la tinción: hematoxilina (portada), eosina (por preparar) y papel (pasados) */
:root{
  --hema:#21124f; --hema-2:#35207a; --on-hema:#ffffff; --eosin:#ee4d84; --on-eosin:#1c0a1a;
  --paper:#f8f2e8; --ink:#1c1626; --muted:#5f5868; --line:#ddd3c3; --card:#fffdf9; --edge:#8c8476;
  --glass:#f4eff7;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif; --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; --f-hand:"Caveat","Segoe Script",cursive;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --hema:#170c3a; --hema-2:#2a1a63; --eosin:#a92b5d; --on-eosin:#ffffff;
  --paper:#15121c; --ink:#f1ecf5; --muted:#ada5b6; --line:#312c3b; --card:#1f1a29; --edge:#756d80; --glass:#2a2336; color-scheme:dark}}
:root[data-theme="dark"]{
  --hema:#170c3a; --hema-2:#2a1a63; --eosin:#a92b5d; --on-eosin:#ffffff;
  --paper:#15121c; --ink:#f1ecf5; --muted:#ada5b6; --line:#312c3b; --card:#1f1a29; --edge:#756d80; --glass:#2a2336; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
h1,h2,h3,p{margin:0}
a{color:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.frame{max-width:1320px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* Portada: una preparación a toda pantalla que se explora con la lente */
.hero{position:relative;background:var(--hema);color:var(--on-hema);min-height:min(86svh,860px);display:flex;align-items:flex-end;overflow:hidden;touch-action:pan-y}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,var(--hema) 0,rgba(33,18,79,.72) 26%,rgba(33,18,79,0) 58%)}
#stage.hot{cursor:pointer}
.tip{position:absolute;z-index:3;left:0;top:0;max-width:280px;padding:8px 12px;border-radius:8px;background:#fff;color:#21124f;font-size:.88em;line-height:1.25;pointer-events:none;box-shadow:0 10px 26px -8px rgba(10,0,40,.6)}
.tip b{display:block}
.hero .frame{z-index:2;position:relative;width:100%;padding-block:32px clamp(28px,5vw,56px);pointer-events:none}
.brand{position:absolute;z-index:3;top:max(18px,env(safe-area-inset-top,0px));left:max(20px,calc((100% - 1320px)/2 + 20px));display:inline-flex;align-items:center;gap:10px;min-height:48px;color:#fff;text-decoration:none;font:400 1.35rem/1 var(--f-display);letter-spacing:.01em}
.brand img{display:block;width:48px;height:48px;box-shadow:0 4px 16px rgba(10,0,40,.45);border-radius:50%}
.place,.summary{text-shadow:0 1px 10px rgba(25,8,65,.85)}
.place{font-size:clamp(1rem,1.5vw,1.2rem);max-width:44ch;margin-bottom:10px;font-weight:700}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(4rem,17.2vw,16rem);line-height:.86;letter-spacing:-.035em;margin-left:-.03em;text-shadow:0 4px 34px rgba(20,8,60,.7)}
.hero-foot{display:flex;flex-wrap:wrap;gap:14px 32px;align-items:center;justify-content:space-between;margin-top:clamp(18px,3vw,32px)}
.summary{font-size:clamp(1.08rem,1.8vw,1.45rem);line-height:1.3;max-width:34ch;text-wrap:balance}
.go{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;background:#fff;color:#21124f;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .16s var(--ease-out)}
.go:active{transform:scale(.97)}
@media (hover:hover){.go:hover{transform:translateY(-2px)}}

/* Filtro: las etiquetas de la caja de preparaciones */
.filter-bar{position:sticky;top:0;z-index:5;background:var(--hema);color:var(--on-hema)}
.filter{display:flex;flex-wrap:wrap;gap:0 4px;padding-block:6px}
.filter button{appearance:none;background:none;border:0;color:inherit;font:inherit;font-size:.96em;min-height:44px;min-width:44px;padding:0 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;opacity:.86}
.filter button i{width:10px;height:10px;border-radius:50%;background:var(--c,#fff);flex:none}
.filter button:hover{opacity:1}
.filter button[aria-pressed="true"]{background:#fff;color:#21124f;opacity:1;font-weight:700}

/* Capítulos */
.chapter{padding-block:clamp(40px,7vw,96px);scroll-margin-top:56px}
.chapter.todo{background:var(--eosin);color:var(--on-eosin)}
.chapter-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:clamp(20px,3.4vw,40px)}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2.7rem,8.4vw,7.4rem);line-height:.92;letter-spacing:-.025em}
.count{font-family:var(--f-display);font-size:clamp(2.7rem,8.4vw,7.4rem);line-height:.92;opacity:.68}

/* El portaobjetos: vidrio con la muestra, etiqueta esmerilada escrita a mano y la ficha debajo */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:clamp(14px,2vw,24px)}
.slide{background:var(--card);color:var(--ink);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;scroll-margin-top:72px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 12px 30px -18px rgba(30,5,30,.55);transition:transform .22s var(--ease-out)}
@media (hover:hover){.slide:hover{transform:translateY(-4px) rotate(-.35deg)}}
.slide:target{outline:3px solid var(--ink);outline-offset:3px}
.glass{position:relative;height:clamp(96px,11vw,132px);background:var(--glass);overflow:hidden}
.glass svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,.34) 0 13%,rgba(255,255,255,0) 13.4% 58%,rgba(255,255,255,.13) 58.3% 68%,rgba(255,255,255,0) 68.3%);pointer-events:none}
.label{position:absolute;z-index:1;left:0;top:0;bottom:0;width:30%;min-width:96px;background:#f7f4ec;color:#26205f;font-family:var(--f-hand);font-size:1.42rem;line-height:1;display:flex;flex-direction:column;justify-content:center;padding:0 12px;transform:none;box-shadow:1px 0 0 rgba(0,0,0,.14);background-image:radial-gradient(rgba(60,40,90,.09) 1px,transparent 1.2px);background-size:4px 4px}
.label span{display:block}
.label .num{color:#c22a5e;font-size:1.65rem;margin-top:3px}
.sheet{padding:16px 18px 10px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{color:var(--muted);font-size:.9em}
.when.soon{color:#b4144f;font-weight:700}
h3{font-family:var(--f-display);font-weight:400;font-size:1.34em;line-height:1.16;text-wrap:pretty}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:10px}
.btn{flex:1 1 0;display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 14px;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .16s var(--ease-out),background-color .16s ease}
.btn:active{transform:scale(.97)}
.btn.main{background:#21124f;color:#fff}
.btn.main:hover{background:#35207a}
.btn.alt{box-shadow:inset 0 0 0 1.5px var(--edge)}
.btn.alt:hover{background:var(--glass)}
.btn.off{color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-weight:400}
.btn .tag{font-weight:400;font-size:.82em;margin-left:6px;opacity:.75}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.main{background:#d9d2ff;color:#17102f}:root:not([data-theme="light"]) .btn.main:hover{background:#fff}:root:not([data-theme="light"]) .when.soon{color:#ff9dbd}}
:root[data-theme="dark"] .btn.main{background:#d9d2ff;color:#17102f}
:root[data-theme="dark"] .btn.main:hover{background:#fff}
:root[data-theme="dark"] .when.soon{color:#ff9dbd}
details{margin-top:2px}
summary{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);font-size:.92em;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3em;line-height:1;color:#c22a5e}
details[open] summary::after{content:"−"}
summary:hover{color:var(--ink)}
.more{list-style:none;margin:0 0 8px;padding:0}
.more a{display:flex;justify-content:space-between;gap:12px;align-items:center;min-height:44px;font-size:.94em;text-decoration:none;border-top:1px solid var(--line)}
.more a:hover{color:#c22a5e}
.more .kind{color:var(--muted);font-size:.84em}

/* Ya pasados: mismo portaobjetos, archivado en la caja */
.chapter.todo .tray{grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr))}
.done .tray{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.done .slide{box-shadow:0 0 0 1px var(--line)}
.done .glass{height:72px}
.done h3{font-size:1.16em}

.closing{background:var(--hema);color:var(--on-hema);overflow:hidden}
.mastery{display:flex;flex-direction:column;gap:5px;font-size:.88em;color:var(--muted)}
.mastery i{display:block;height:7px;border-radius:999px;background:var(--glass);overflow:hidden}
.mastery b{display:block;height:100%;background:linear-gradient(90deg,#21124f,#ee4d84);border-radius:999px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.tools button,.tools label{appearance:none;font:inherit;font-weight:700;font-size:.94em;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;border-radius:999px;border:1.5px solid rgba(255,255,255,.6);background:transparent;color:#fff;cursor:pointer}
.tools button:hover,.tools label:hover{background:rgba(255,255,255,.12)}
.tools label:focus-within{outline:3px solid #fff;outline-offset:3px}
.tools input{position:absolute;width:1px;height:1px;opacity:0}
.tools-msg{min-height:1.5em;margin-top:8px}
.closing .frame{padding-block:clamp(28px,4vw,48px) 0}
.closing p{max-width:58ch}
.word{font-family:var(--f-display);font-size:clamp(4rem,23.5vw,21rem);line-height:.84;letter-spacing:-.04em;margin-top:.14em;margin-bottom:.02em;opacity:.95;color:#ee4d84;white-space:nowrap}

@media (max-width:680px){
  body{font-size:16px}
  .hero{min-height:74svh}
  .hero .frame{padding-block:40px 18px}
  .tip{display:none}
  .go{width:100%;justify-content:center;min-height:48px}
  .brand span{display:none}
  .brand{top:max(12px,env(safe-area-inset-top,0px))}
  .brand img{width:42px;height:42px}
  .hero-foot{gap:12px}
  .place{font-size:.92em}
  h1{font-size:clamp(4rem,21vw,7.4rem)}
  .hero-foot{margin-top:12px}
  .filter-bar{position:static}
  .filter button{padding:0 10px;font-size:.92em}
  .chapter{padding-block:24px 36px}
  .chapter-h{margin-bottom:14px}
  .glass{height:84px}
  .done .glass{height:60px}
}
</style>
</head>
<body>
<header class="hero" id="hero">
  <canvas id="lens" aria-hidden="true"></canvas>
  <canvas id="stage" aria-hidden="true" hidden></canvas>
  <p class="tip" id="tip" aria-hidden="true" hidden></p>
  <a class="brand" href="./" aria-label="TSAPC, inicio"><img src="assets/logo.svg" alt="" width="48" height="48"><span>TSAPC</span></a>
  <div class="frame">

      <p class="summary" id="summary"></p>
      <a class="go" id="go" href="#preparar">Ver lo que toca →</a>
    </div>
  </div>
</header>
<div class="filter-bar"><div class="frame filter" id="filter" role="group" aria-label="Filtrar por asignatura"></div></div>

<main id="list"></main>
<footer class="closing">
  <div class="frame">
    <p>En cada página tienes arriba el botón «← Menú» para volver aquí. Los PDF se pueden descargar.</p>
    <div class="tools">
      <button type="button" id="bkSave">Guardar copia de mi progreso</button>
      <label>Restaurar una copia<input type="file" id="bkLoad" accept="application/json,.json"></label>
      <button type="button" id="install" hidden>Instalar como app</button>
    </div>
    <p class="tools-msg" id="bkMsg" role="status"></p>
    <div class="word" aria-hidden="true">TSAPC</div>
  </div>
</footer>

EX.forEach(e=>{if(e.fecha){const d=new Date(e.fecha+"T00:00:00");e.days=Math.round((d-today)/864e5);e.fd=DIAS[d.getDay()]+" "+d.getDate()+" "+MES[d.getMonth()];e.state=e.days<0?"done":"up"}else e.state="tbd"});

const nx=upcoming[0];

const SHORT={"Técnicas Generales de Laboratorio":"Laboratorio","Gestión de Muestras":"Gestión","Biología Molecular":"Biología"};
const LAB={"Técnicas Generales de Laboratorio":"Lab","Gestión de Muestras":"Gestión","Biología Molecular":"Bio","Fisiopatología":"Fisio","IPE 1":"IPE","Inglés":"Inglés"};
const SW={fisio:"#ee4d84",ipe:"#e0433a",bio:"#9a7bff",gest:"#f2b134",ing:"#55a8ff",lab:"#54c98a"};

  ?`${nx.days===0?"Hoy":nx.days===1?"Mañana":"En "+nx.days+" días"}: ${esc(nx.asig)}, ${esc(nx.ex)}. ${toStudy.length} por preparar.`
  :`${toStudy.length} exámenes por preparar, todavía sin fecha, y ${past.length} ya pasados.`;

const UNIT=e=>(e.rep.web||e.sim.web||"").split("/")[0];
const specimen=e=>tsapcSpecimen(UNIT(e));

const PROG={"bio3": {"key": "bio3-repaso-v1", "total": 40}, "bio1": {"key": "bio1-repaso-v1", "total": 32}, "gest1": {"key": "gest1-repaso-v1", "total": 75}, "gest2": {"key": "gest2-repaso-v1", "total": 31}, "bio2": {"key": "bio2-repaso-v1", "total": 37}, "ingles1": {"key": "ing1-repaso-v1", "total": 26}, "ipe2": {"key": "ipe2-repaso-v1", "total": 29}, "fisio2": {"key": "fisio2-repaso-v3", "total": 70}, "ipe-tema5": {"key": "ipe5-repaso-v1", "total": 35}, "lab1": {"key": "lab1-repaso-v1", "total": 47}, "fisio1": {"key": "fisio1-repaso-v1", "total": 52}, "fisio3": {"key": "fisio3-repaso-v1", "total": 90}};
const KEYS=["bio3-repaso-v1", "bio3-simulacro-v1", "bio1-repaso-v1", "bio1-simulacro-v1", "bio2-repaso-v1", "bio2-simulacro-v1", "eng-lab-vocab-full-v1", "eng-lab-vocab-v2", "eng-u12-exam-v2", "eng-u12-simulacro-v1", "fisio1-repaso-v1", "fisio1-simulacro-v1", "fisio2-repaso-v3", "fisio2-simulacro-v2", "fisio3-repaso-v1", "fisio3-simulacro-v1", "gest1-repaso-v1", "gest1-simulacro-v1", "gest2-repaso-v1", "gest2-simulacro-v1", "ing1-repaso-v1", "ipe2-repaso-v1", "ipe2-simulacro-v1", "ipe3-simulacro-v1", "ipe5-repaso-v1", "lab-u1-test153", "lab-u1-test50", "lab-u1-test50-b", "lab-words-learn-v1", "lab1-repaso-v1"];
function progress(e){const p=PROG[UNIT(e)];if(!p)return null;let done=0;try{const s=JSON.parse(localStorage.getItem(p.key)||"null");if(s&&s.done)done=Object.keys(s.done).length}catch(_){}return{done:Math.min(done,p.total),total:p.total}}
const when=e=>e.state==="up"?`<span class="when${e.days<=7?" soon":""}">${e.days===0?"Hoy":e.days===1?"Mañana":"Faltan "+e.days+" días"} · ${e.fd}</span>`:e.state==="done"?`<span class="when">Pasado · ${e.fd}</span>`:`<span class="when">Fecha por confirmar</span>`;
function btn(kind,o,cls,e){const T=kind==="rep"?"Repaso":"Simulacro",L=`aria-label="${T}: ${esc(e.asig)}, ${esc(e.ex)}"`;
  if(o.web)return `<a class="btn ${cls}" href="${o.web}" ${L}>${T}</a>`;
  if(o.pdf)return `<a class="btn ${cls}" href="${o.pdf}" ${L}>${T}<span class="tag">PDF</span></a>`;
  return `<span class="btn off">${T}: pendiente</span>`}
const clean=t=>t.replace(/^[^\p{L}\p{N}]+/u,"");
function materials(e){const m=[];
  if(e.rep.web&&e.rep.pdf)m.push(["Repaso",e.rep.pdf]);
  if(e.sim.web&&e.sim.pdf)m.push(["Simulacro",e.sim.pdf]);
  (e.extra||[]).forEach(([t,u])=>m.push([clean(t),u]));
  return m}
function row(e){const m=materials(e);
  return `<article class="slide" id="${e.id}">
   <div class="glass">${specimen(e)}<div class="label" aria-hidden="true"><span>${esc(LAB[e.asig]||e.asig)}</span><span class="num">${esc(e.ex.replace(" examen",""))}</span></div></div>
   <div class="sheet">
    <p class="meta">${esc(e.asig)} · ${esc(e.ex)} · ${when(e)}</p>
    <h3>${esc(e.tema)}</h3>
    ${(pr=>pr?`<div class="mastery"><span>${pr.done?`Dominas ${pr.done} de ${pr.total}`:`${pr.total} conceptos`}</span><i aria-hidden="true"><b style="width:${pr.done/pr.total*100}%"></b></i></div>`:"")(progress(e))}
    ${e.sim.webt?`<p class="meta">Simulacro: ${esc(e.sim.webt)}</p>`:""}
    <div class="actions">${btn("rep",e.rep,"main",e)}${btn("sim",e.sim,"alt",e)}</div>
    ${m.length?`<details><summary aria-label="Más material de ${esc(e.asig)}, ${esc(e.ex)}: ${m.length}">Más material (${m.length})</summary><ul class="more">${m.map(([t,u])=>`<li><a href="${u}"><span>${esc(t)}</span><span class="kind">${/\.pdf$/i.test(u)?"PDF":"Web"}</span></a></li>`).join("")}</ul></details>`:""}
   </div>
  </article>`}
function group(id,cls,title,list){return list.length?`<section class="chapter ${cls}" id="${id}"><div class="frame"><div class="chapter-h"><h2>${title}</h2><span class="count"><span aria-hidden="true">${list.length}</span><span class="sr-only">${list.length} ${list.length===1?"examen":"exámenes"}</span></span></div><div class="tray">${list.map(row).join("")}</div></div></section>`:""}

let current=null;try{const c=sessionStorage.getItem("asig");if(asigs.includes(c))current=c}catch(_){}
// Lo siguiente: el examen por preparar con menos progreso
(function(){const pct=e=>{const p=progress(e);return p?p.done/p.total:1};const next=upcoming[0]||[...toStudy].sort((a,b)=>pct(a)-pct(b))[0];if(!next)return;const g=document.getElementById("go");g.href=next.rep.web||"#"+next.id;g.textContent="Seguir con "+(LAB[next.asig]||next.asig)+" · "+next.ex.replace(" examen","")+" →"})();
const list=document.getElementById("list"),filter=document.getElementById("filter");
function render(){const f=a=>!current||a.asig===current;
  list.innerHTML=group("preparar","todo","Por preparar",toStudy.filter(f))+group("pasados","done","Ya pasados",past.filter(f));
  filter.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String((b.dataset.a||null)===current)));
  const n=list.querySelectorAll(".slide").length;document.getElementById("status").textContent=n+(n===1?" examen":" exámenes")+(current?" de "+current:"");
  try{current?sessionStorage.setItem("asig",current):sessionStorage.removeItem("asig")}catch(_){}
  window.revealSlides&&window.revealSlides()}
filter.innerHTML=`<button type="button" data-a="">Todas</button>`+asigs.map(a=>{const col=EX.find(e=>e.asig===a).col;return `<button type="button" data-a="${esc(a)}" style="--c:${SW[col]}"><i aria-hidden="true"></i>${esc(SHORT[a]||a)}</button>`}).join("");
filter.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;current=b.dataset.a||null;render()});
render();
// Un enlace directo a un examen quita el filtro si lo estaba ocultando
const showHash=()=>{const id=location.hash.slice(1);if(id&&current&&!document.getElementById(id)){current=null;render();document.getElementById(id)?.scrollIntoView()}};
addEventListener("hashchange",showHash);showHash();

/* Copia de seguridad: solo las claves de estas páginas, en un archivo que guarda el propio usuario */
(function(){const msg=document.getElementById("bkMsg"),allowed=k=>KEYS.includes(k);
  document.getElementById("bkSave").addEventListener("click",()=>{const data={};KEYS.forEach(k=>{try{const v=localStorage.getItem(k);if(v!==null)data[k]=v}catch(_){}});
    const n=Object.keys(data).length;if(!n){msg.textContent="Todavía no hay progreso que guardar.";return}
    const url=URL.createObjectURL(new Blob([JSON.stringify({app:"tsapc",saved:new Date().toISOString(),data})],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download="tsapc-progreso-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);msg.textContent="Copia guardada con "+n+(n===1?" página.":" páginas.")});
  document.getElementById("bkLoad").addEventListener("change",async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(_){msg.textContent="Ese archivo no es una copia válida.";return}
    if(!j||j.app!=="tsapc"||!j.data||typeof j.data!=="object"){msg.textContent="Ese archivo no es una copia de esta web.";return}
    const ks=Object.keys(j.data).filter(k=>allowed(k)&&typeof j.data[k]==="string");if(!ks.length){msg.textContent="La copia no contiene progreso.";return}
    msg.textContent="";const b=document.createElement("button");b.type="button";b.textContent="Sí, sustituir mi progreso por la copia ("+ks.length+")";b.style.cssText="appearance:none;font:inherit;font-weight:700;min-height:44px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:#21124f;cursor:pointer";msg.appendChild(b);
    b.addEventListener("click",()=>{try{ks.forEach(k=>localStorage.setItem(k,j.data[k]));msg.textContent="Copia restaurada. Actualizando…";setTimeout(()=>location.reload(),700)}catch(_){msg.textContent="No se pudo restaurar: el navegador bloquea el guardado."}})});
  let prompt;const ins=document.getElementById("install");addEventListener("beforeinstallprompt",e=>{e.preventDefault();prompt=e;ins.hidden=false});
  ins.addEventListener("click",async()=>{if(!prompt)return;prompt.prompt();await prompt.userChoice;prompt=null;ins.hidden=true});
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))})();

/* La lente: el tejido se pinta una vez y cada fotograma solo copia un círculo ampliado */
(function(){const hero=document.getElementById("hero"),cv=document.getElementById("lens"),ctx=cv.getContext("2d");
  const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,D,tissue,lx,ly,tx,ty,R,user=false,raf=0,visible=true,t=0,dead=false;
  function paint(){D=Math.min(devicePixelRatio||1,2);W=hero.clientWidth;H=hero.clientHeight;cv.width=W*D;cv.height=H*D;
    tissue=document.createElement("canvas");tissue.width=cv.width;tissue.height=cv.height;
    const g=tissue.getContext("2d");g.fillStyle="#a92b5d";g.fillRect(0,0,cv.width,cv.height);
    let s=20261030;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
    const step=46*D;let row=0;
    for(let y=-step;y<cv.height+step;y+=step*.84,row++)for(let x=-step+(row%2?step/2:0);x<cv.width+step;x+=step){
      const cx=x+(r()-.5)*step*.5,cy=y+(r()-.5)*step*.5,a=r()*Math.PI,rx=step*(.36+r()*.2),ry=step*(.28+r()*.16);
      g.fillStyle=["#c43a71","#b4305f","#cf4b7e","#9a2552"][Math.floor(r()*4)];g.beginPath();g.ellipse(cx,cy,rx,ry,a,0,7);g.fill();
      g.fillStyle=r()>.82?"#170a44":"#2b1a78";g.beginPath();g.ellipse(cx+(r()-.5)*step*.14,cy+(r()-.5)*step*.14,step*(.11+r()*.08),step*(.1+r()*.07),a,0,7);g.fill();
      if(r()>.7){g.fillStyle="rgba(255,190,215,.32)";g.beginPath();g.arc(cx-rx*.35,cy-ry*.3,step*.05,0,7);g.fill()}}
    R=Math.max(90,Math.min(W,H)*.34);
    if(lx===undefined){lx=tx=W*.72;ly=ty=H*.38}
    draw()}
  function draw(){const c=ctx;c.setTransform(1,0,0,1,0,0);
    c.fillStyle="#21124f";c.fillRect(0,0,cv.width,cv.height);c.globalAlpha=.34;c.drawImage(tissue,0,0);c.globalAlpha=1;
    const px=lx*D,py=ly*D,pr=R*D,z=1.7;
    c.save();c.beginPath();c.arc(px,py,pr,0,7);c.clip();
    c.translate(px,py);c.scale(z,z);c.translate(-px,-py);c.drawImage(tissue,0,0);c.restore();
    const v=c.createRadialGradient(px,py,pr*.72,px,py,pr);v.addColorStop(0,"rgba(20,8,60,0)");v.addColorStop(1,"rgba(20,8,60,.62)");
    c.fillStyle=v;c.beginPath();c.arc(px,py,pr,0,7);c.fill();
    c.strokeStyle="rgba(255,255,255,.9)";c.lineWidth=2*D;c.beginPath();c.arc(px,py,pr,0,7);c.stroke()}
  function tick(){raf=0;if(!visible||dead)return;t+=.0042;
    if(!user){tx=W*(.66+.2*Math.sin(t*1.3));ty=H*(.38+.16*Math.sin(t*2.1))}
    lx+=(tx-lx)*.09;ly+=(ty-ly)*.09;draw();raf=requestAnimationFrame(tick)}
  const start=()=>{if(!still&&!raf&&visible)raf=requestAnimationFrame(tick)};
  hero.addEventListener("pointermove",e=>{const b=hero.getBoundingClientRect();user=true;tx=e.clientX-b.left;ty=e.clientY-b.top;
    if(still){lx=tx;ly=ty;draw()}});
  hero.addEventListener("pointerleave",()=>{user=false});
  new IntersectionObserver(([en])=>{visible=en.isIntersecting;start()}).observe(hero);
  let rs;addEventListener("resize",()=>{clearTimeout(rs);rs=setTimeout(()=>{lx=lx*hero.clientWidth/W;ly=ly*hero.clientHeight/H;paint()},150)});
  paint();start();window.heroLens={stop(){dead=true;cv.hidden=true},resume(){dead=false;cv.hidden=false;paint();start()},grow(from){const end=R;R=from;return{get r(){return R},set r(v){R=v;if(still)draw()},end}}}})();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
/* Hélice de portaobjetos en 3D: uno por examen, con su muestra. Si no hay WebGL se queda la lente 2D */
(function(){if(!window.THREE)return;
  const hero=document.getElementById("hero"),cv=document.getElementById("stage"),tip=document.getElementById("tip");
  let gl;try{gl=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:"high-performance"})}catch(_){return}
  let still=matchMedia("(prefers-reduced-motion: reduce)").matches;const small=innerWidth<680;
  cv.hidden=false;heroLens.stop();
  gl.setPixelRatio(Math.min(devicePixelRatio||1,small?1.5:2));
  const bg=getComputedStyle(document.documentElement).getPropertyValue("--hema").trim()||"#21124f";
  const scene=new THREE.Scene();scene.background=new THREE.Color(bg);scene.fog=new THREE.Fog(bg,10,30);
  const cam=new THREE.PerspectiveCamera(38,1,.1,70);
  scene.add(new THREE.AmbientLight(0xffffff,.95));
  const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(5,8,9);scene.add(key);
  const rim=new THREE.PointLight(0xff4d8d,70,30);rim.position.set(-7,-3,5);scene.add(rim);

  // Células: dos mallas instanciadas para citoplasma y núcleo
  const N=small?90:260,sph=new THREE.SphereGeometry(1,18,14),sph2=new THREE.SphereGeometry(1,12,10);
  const cyt=new THREE.InstancedMesh(sph,new THREE.MeshStandardMaterial({roughness:.3,transparent:true,opacity:.5,depthWrite:false}),N);
  const nuc=new THREE.InstancedMesh(sph2,new THREE.MeshStandardMaterial({color:0x4a2fc0,emissive:0x2a1a8a,emissiveIntensity:.8,roughness:.42}),N);
  const m=new THREE.Object3D(),col=new THREE.Color(),P=["#ee4d84","#d93a72","#f27aa3","#b82f66"];let s=20261030;const r=()=>(s=(s*1664525+1013904223)%4294967296)/4294967296;
  for(let i=0;i<N;i++){const x=(r()-.5)*34,y=(r()-.5)*20,z=-24+r()*22,k=.42+r()*.62;
    m.position.set(x,y,z);m.rotation.set(r()*3,r()*3,r()*3);m.scale.set(k,k*(.72+r()*.28),k*(.72+r()*.28));m.updateMatrix();cyt.setMatrixAt(i,m.matrix);cyt.setColorAt(i,col.set(P[i%4]));
    m.scale.set(k*.36,k*.3,k*.34);m.updateMatrix();nuc.setMatrixAt(i,m.matrix)}
  const cells=new THREE.Group();cells.add(cyt,nuc);scene.add(cells);

  // Portaobjetos: textura con etiqueta y muestra, vidrio encima y canto brillante
  const helix=new THREE.Group();scene.add(helix);const slides=[];const ORDER=[...toStudy,...past];
  const SW3=2.9,SH3=.96,stepA=.82,stepY=.6;
  function texture(e){const c=document.createElement("canvas");c.width=768;c.height=256;const x=c.getContext("2d");x.fillStyle="#f4eff7";x.fillRect(0,0,768,256);
    const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=4;
    const label=()=>{x.fillStyle="#f7f4ec";x.fillRect(0,0,226,256);x.fillStyle="rgba(0,0,0,.14)";x.fillRect(226,0,2,256);
      x.fillStyle="#26205f";x.font='700 54px Caveat,cursive';x.fillText(LAB[e.asig]||e.asig,20,112);x.fillStyle="#c22a5e";x.font='700 50px Caveat,cursive';x.fillText(e.ex.replace(" examen",""),20,172);tx.needsUpdate=true};
    const im=new Image();im.onload=()=>{const k=Math.max(542/im.width,256/im.height);x.drawImage(im,226+(542-im.width*k)/2,(256-im.height*k)/2,im.width*k,im.height*k);label()};im.onerror=label;
    im.width=840;im.height=240;im.src="data:image/svg+xml,"+encodeURIComponent(specimen(e).replace("<svg ",'<svg width="840" height="240" '));
    return tx}
  const glassG=new THREE.BoxGeometry(SW3,SH3,.07),planeG=new THREE.PlaneGeometry(SW3*.985,SH3*.96),edgeG=new THREE.EdgesGeometry(glassG);
  const glassM=new THREE.MeshPhysicalMaterial({color:0xffffff,transparent:true,opacity:.2,roughness:.06,clearcoat:1,depthWrite:false}),edgeM=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.75});
  function build(){ORDER.forEach((e,i)=>{const a=i*stepA,g=new THREE.Group(),y=(ORDER.length-1)/2*stepY-i*stepY;
      g.position.set(Math.cos(a)*2.55,y,Math.sin(a)*2.55);g.rotation.y=Math.PI/2-a;
      const map=texture(e),plane=new THREE.Mesh(planeG,new THREE.MeshStandardMaterial({map,emissive:0xffffff,emissiveMap:map,emissiveIntensity:.3,roughness:.28,side:THREE.DoubleSide}));
      plane.userData.i=i;g.add(plane,new THREE.Mesh(glassG,glassM),new THREE.LineSegments(edgeG,edgeM));g.userData={e,base:g.position.clone(),lift:0,target:0};helix.add(g);slides.push(g)})}
  (document.fonts&&document.fonts.load?document.fonts.load('700 54px Caveat').catch(()=>{}):Promise.resolve()).then(()=>{build();if(still)frame()});

  let W=1,H=1,mx=0,my=0,cx=0,cy=0,raf=0,seen=true,hot=null,spin=0;const t0=performance.now();
  function fit(){W=hero.clientWidth;H=hero.clientHeight;gl.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();
    const narrow=W/H<1.05;helix.scale.setScalar(narrow?.5:.82);helix.position.set(narrow?0:W/H*2.2,narrow?2.05:.5,0);if(still)frame()}
  const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  function pick(e){const b=hero.getBoundingClientRect();ndc.set((e.clientX-b.left)/W*2-1,-((e.clientY-b.top)/H)*2+1);ray.setFromCamera(ndc,cam);
    const h=ray.intersectObjects(slides.map(g=>g.children[0]));return h.length?slides[h[0].object.userData.i]:null}
  hero.addEventListener("pointermove",e=>{const b=hero.getBoundingClientRect();mx=(e.clientX-b.left)/W*2-1;my=(e.clientY-b.top)/H*2-1;
    if(e.pointerType==="touch")return;const g=pick(e);if(g!==hot){if(hot)hot.userData.target=0;hot=g;if(g)g.userData.target=1;cv.classList.toggle("hot",!!g);hero.style.cursor=g?"pointer":""}
    if(g){const d=g.userData.e;tip.innerHTML=`<b>${esc(d.asig)} · ${esc(d.ex)}</b>${esc(d.tema)}`;tip.hidden=false;tip.style.transform=`translate(${Math.min(e.clientX-b.left+16,W-296)}px,${e.clientY-b.top+16}px)`}else tip.hidden=true;
    if(still)frame()});
  hero.addEventListener("pointerleave",()=>{mx=my=0;if(hot)hot.userData.target=0;hot=null;tip.hidden=true});
  hero.addEventListener("click",e=>{if(e.target.closest("a"))return;const g=hot||pick(e);if(!g)return;const id=g.userData.e.id;current=null;render();history.replaceState(null,"","#"+id);const el=document.getElementById(id);el&&scrollTo({top:scrollY+el.getBoundingClientRect().top-(innerWidth>680?76:16)})});
  function frame(){const now=performance.now(),i=still?1:Math.min((now-t0)/1500,1),ease=1-Math.pow(1-i,4);
    const b=hero.getBoundingClientRect(),p=Math.max(0,Math.min(1,-b.top/Math.max(b.height,1)));
    if(!still)spin+=hot?.0007:.0032;cx+=(mx-cx)*.06;cy+=(my-cy)*.06;
    helix.rotation.y=spin+(1-ease)*-2.6+p*2.4+cx*.5;helix.rotation.x=cy*.12;
    slides.forEach(g=>{const u=g.userData;u.lift+=(u.target-u.lift)*.16;const k=1+u.lift*.42;g.scale.setScalar(k*ease);
      g.position.copy(u.base).multiplyScalar(1+u.lift*.18)});
    cells.rotation.y=now*.000018+cx*.05;cells.rotation.x=cy*.03;cells.position.y=p*2;
    cam.position.set(cx*.5,-cy*.25-p*.8,11.5-p*5);cam.lookAt(0,0,-2);gl.render(scene,cam)}
  // Si el dispositivo va justo, baja la calidad; si aun así no llega, deja la escena fija
  let last=0,dts=[],level=0;
  function tune(now){if(last&&now-last<500)dts.push(now-last);last=now;if(dts.length<45||now-t0<1600)return;const avg=dts.reduce((a,b)=>a+b,0)/dts.length;dts=[];
    if(avg>30&&level===0){level=1;gl.setPixelRatio(1);cyt.count=nuc.count=Math.floor(N/2);fit()}
    else if(avg>45&&level===1){level=2;still=true}}
  function tick(now){raf=0;if(!seen)return;frame();tune(now);if(still)return;raf=requestAnimationFrame(tick)}
  const go=()=>{if(!still&&!raf&&seen)raf=requestAnimationFrame(tick)};
  new IntersectionObserver(([en])=>{seen=en.isIntersecting;go()}).observe(hero);
  let rs;addEventListener("resize",()=>{clearTimeout(rs);rs=setTimeout(fit,120)});
  cv.addEventListener("webglcontextlost",ev=>{ev.preventDefault();seen=false;cv.hidden=true;tip.hidden=true;heroLens.resume()});
  fit();frame();go();
  addEventListener("scroll",()=>{if(still&&seen)requestAnimationFrame(frame)},{passive:true});
  window.hero3D={slides,pick}})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
// Todo es visible sin GSAP; la animación solo se añade si la librería carga pronto y el movimiento está permitido
if(window.gsap&&window.ScrollTrigger&&performance.now()<1200&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
  gsap.registerPlugin(ScrollTrigger);
  const l=heroLens.grow(20);gsap.to(l,{r:l.end,duration:1.3,ease:"power3.out"});
  gsap.from("h1",{yPercent:14,duration:.9,ease:"power3.out"});

  window.revealSlides=()=>{ScrollTrigger.getAll().forEach(s=>s.kill());
    ScrollTrigger.batch(".slide",{start:"top 94%",once:true,onEnter:b=>gsap.fromTo(b,{y:34,rotate:-1.2,opacity:0},{y:0,rotate:0,opacity:1,duration:.55,ease:"power3.out",stagger:.06,clearProps:"transform,opacity"})})};

}
